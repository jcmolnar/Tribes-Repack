; By default, xLoader will load DLLs at the end of the startup/autoexec process
; By creating an .ini file for a specific DLL, you can configure xLoader to load that DLL at the beginning of the startup process (before autoexec)
;
; To load a specific DLL at the beginning of the startup process, copy this Example.ini, rename it to the name of your DLL, and save to /plugins folder.
; For example, if your DLL is named Aimbot.dll, this file should be named Aimbot.ini :)
[settings]
load_method=init
