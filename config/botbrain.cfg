# BotBrain roster + gear + weapons + composition. Parsed by botBrain.cpp loadConfig() --
# flat text, NOT console script (immune to the parser's comment/brace hazards).
#   bot  <team> <armor> <voice> <name>
#   gear <armor> <itemDat> <count>     (applies at spawn; first line per armor is mounted)
#   weap <armor> <maxDist> <itemDat>   (ordered near->far; first whose maxDist covers the
#                                       target distance is mounted at think time)
#   comp <ctf|cnh|dm> <role> <count>   (desired role counts per team; mid=99 is filler)
#                                       roles: mid capper guard sniper demo painter mortar switch

bot 0 marmor male1 BB_Kirk
bot 0 marmor male2 BB_Sulu
bot 0 larmor male3 BB_Worf
bot 0 mfemale fem1 BB_Uhura
bot 0 marmor male4 BB_Spock
bot 0 larmor fem2 BB_Rand
bot 1 marmor male5 BB_Blaze
bot 1 marmor male1 BB_Vixen
bot 1 larmor male2 BB_Fang
bot 1 mfemale fem3 BB_Colleen
bot 1 marmor male3 BB_Balto
bot 1 larmor fem4 BB_Exile

# ★MAP-DRIVEN ARMOUR.★ A map with NO inventory station is a fixed-loadout map: you keep what
# you spawn with, which is how LT maps enforce light armour (CanyonCrusadeDeluxeLT has 0
# stations; Raindance has 3). On those maps every bot spawns in this armour instead of its
# roster armour, and the matching gear/weap lines below apply. Nothing is keyed on map NAMES.
fixedarmor larmor

gear marmor disclauncher 1
gear marmor discammo 100
gear marmor Chaingun 1
gear marmor bulletammo 200
gear marmor energypack 1
gear marmor repairkit 1
gear mfemale disclauncher 1
gear mfemale discammo 100
gear mfemale PlasmaGun 1
gear mfemale plasmaammo 100
gear mfemale energypack 1
gear mfemale repairkit 1
# LT legal loadout, verbatim from the mission briefing: Light Armor, Energy Pack,
# Disc Launcher(15), Grenade Launcher(10), Chaingun(100), Grenades(5), Beacons(3),
# Targeting Laser(1), Repair Kit(1). PlasmaGun is NOT in it and the disc launcher --
# the weapon LT is actually played with -- was missing entirely.
gear larmor disclauncher 1
gear larmor discammo 15
gear larmor Chaingun 1
gear larmor bulletammo 100
gear larmor GrenadeLauncher 1
gear larmor grenadeammo 10
gear larmor energypack 1
gear larmor repairkit 1

# maxDist is the range that weapon is CHOSEN for -- and it is now also the range the bot is
# allowed to acquire targets at ($pref::botWeaponRangeCap). The chaingun used to read 9999,
# which meant "any range": snipers with spotDist 600 machine-gunned players across the map.
# 140 is a chaingun's honest reach. Long range belongs to the rifle below.
weap marmor 40 disclauncher
weap marmor 140 Chaingun
weap mfemale 40 PlasmaGun
weap mfemale 140 disclauncher
weap larmor 45 disclauncher
weap larmor 140 Chaingun

# ROLE-SCOPED loadout: a line keyed on a role name instead of an armour applies only to that
# role and outranks the armour lines. Nothing uses it right now -- it exists because the
# alternative (arming a "sniper" with a rifle) is ILLEGAL IN LT. The mission's own briefing
# lists the whole legal loadout:
#   "Light Armor, Energy Pack, Disc Launcher(15), Grenade Launcher(10), Chaingun(100),
#    Grenades(5), Beacons(3), Targeting Laser(1), Repair Kit(1)"
# No Laser Rifle. There is no sniper in LT, which is also why the playt1 role guides list
# capper / light offense / chase / home and no marksman. Example if a non-LT rotation ever
# wants one:
#   gear sniper LaserRifle 1
#   weap sniper 900 LaserRifle

# guard = HOME defence: holds the stand and does NOT chase (competitive LT's hard rule).
# chase = flag recovery: hunts the enemy carrier. Without a chase slot a double grab can
# never resolve -- both teams hold and the match locks (measured on CanyonCrusadeDeluxeLT).
# lo    = LIGHT OFFENSE: never grabs; kills the enemy home defender in the window just before
#         our cappers arrive (an early kill is wasted -- they respawn). Needs $pref::botLoStrike
#         (seconds of capper ETA at which it commits, default 10).
# ★SKILL PER ROLE (0-100).★ One number drives a lot: the engine scales aim error (vertDope
# 0.0-0.2 at 100 down to 1.3-4.0 at 0), RUN SPEED (1.0 -> 0.4 of the armour cap), turn rate
# and reaction cadence from it. So skill IS speed as well as accuracy, which is why the split
# runs the way it does:
#   capper 100  they need the legs most, and 100 buys ~6% over the old flat 90
#   chase   92  has to actually catch a capper
#   switch  90  a runner too
#   lo      82  fights, but should not be superhuman
#   sniper  78
#   mid     70
#   guard   55  home defence is meant to be beatable -- every bot at 90 meant nobody missed,
#               and perfect aim structurally favours the defender over the attacker crossing
#               open ground. This is the pressure valve that lets offense exist.
# $pref::botSkillScale (default 100) scales the whole field at once for an easier/harder server.
skill capper 100
skill chase 92
skill switch 90
skill lo 82
skill sniper 78
skill mid 70
skill guard 55

# sniper 0: LT has no sniper. The rifle is not in the legal loadout (see the weap block), and
# the competitive role set is capper / light offense / chase / home. Leaving the quota at 1
# just produced a bot with a chaingun and a 600 u leash.
comp ctf capper 2
comp ctf guard 1
comp ctf chase 1
comp ctf lo 1
comp ctf sniper 0
comp ctf mid 99
comp cnh switch 3
comp cnh mid 99
comp dm mid 99

