# BotBrain roster + gear + weapons + composition. Parsed by botBrain.cpp loadConfig() --
# flat text, NOT console script (immune to the parser's comment/brace hazards).
#   bot  <team> <armor> <voice> <name>
#   gear <armor> <itemDat> <count>     (applies at spawn; first line per armor is mounted)
#   weap <armor> <maxDist> <itemDat>   (ordered near->far; first whose maxDist covers the
#                                       target distance is mounted at think time)
#   comp <ctf|cnh|dm> <role> <count>   (desired role counts per team; mid=99 is filler)
#                                       roles: mid capper guard sniper demo painter mortar switch

